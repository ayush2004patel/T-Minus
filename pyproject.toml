[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tminus"
version = "0.1.0"
description = "Count down to a clean Frappe/ERPNext upgrade."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
tminus = "tminus.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tminus"]  # rules/*.yaml ship inside the package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]  # fixtures contain deliberately bad imports

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]  # typer's documented default style
