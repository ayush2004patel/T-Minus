message: >
  A field that no longer exists on this DocType in v16 is read, filtered on or written. Reading it can fail with an unknown-field error or quietly return nothing. The detail line says what replaced it.
replacement: >
  Use the replacement named in the detail line. Where it only says removed, read the v16 DocType and port the logic; do not redesign it.
fix: before
autofix: none
confidence: high
references:
  - "verified: DocType JSON diff of erpnext version-15 vs version-16 (fields of data type only)"
  - "replacements verified against erpnext version-16 patches (rename_field calls and move patches); fields marked removed have no patch evidence"
  - "BWH ERPNext Upgrade Playbook, section 'API Changes: Fields & functions that moved'"