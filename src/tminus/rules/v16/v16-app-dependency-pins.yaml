message: >
  A dependency of this app has a version range that no release can satisfy together with the version frappe v16 requires. pip reports a conflict and the app cannot be installed next to frappe v16. The comparison tests the versions named in both ranges and their neighbours, so it can miss an exotic overlap.
replacement: >
  Loosen the app's pin (or move to the version frappe uses) on the version-16 branch.
fix: before
autofix: none
confidence: medium
references:
  - "verified: frappe 16.54.0 pyproject.toml dependencies (URL dependencies are skipped)"
  - "pins go stale when frappe v16 is updated; regenerate them from its pyproject.toml"